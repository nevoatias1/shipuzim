spring.datasource.url=jdbc:h2:mem:contact_requests_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.h2.console.enabled=false
app.mail.enabled=false
app.contact.rate-limit.limit=2
app.auth.rate-limit.limit=2
# Keep environment bootstrap credentials out of unrelated tests.
ADMIN_USERNAME=
ADMIN_PASSWORD=
