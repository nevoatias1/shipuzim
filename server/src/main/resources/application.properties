spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.main.allow-circular-references=true
jwt.secret=${JWT_SECRET}
jwt.expiration=36000000
app.auth.rate-limit.limit=10
app.auth.rate-limit.window-seconds=600
app.auth.rate-limit.max-ips=10000
app.google.client-id=${GOOGLE_CLIENT_ID:}
app.reviews.rate-limit.limit=5
app.reviews.rate-limit.window-seconds=3600
app.reviews.rate-limit.max-ips=10000
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.log-request-details=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.contact.rate-limit.limit=5
app.contact.rate-limit.window-seconds=600
app.contact.rate-limit.max-ips=10000
spring.h2.console.enabled=false
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
# Drain rejected requests within the multipart request budget so clients receive the JSON 413.
server.tomcat.max-swallow-size=11MB
app.gallery.storage=${GALLERY_STORAGE:local}
app.gallery.local-directory=${GALLERY_UPLOAD_DIR:./uploads}
